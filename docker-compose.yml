services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/referral_harvest.db}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      DEFAULT_SMS_SENDER: ${DEFAULT_SMS_SENDER:-console}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional Postgres profile: DATABASE_URL=postgresql+psycopg://rh:rh@db:5432/referral_harvest
  # docker compose --profile postgres up --build -d
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: rh
      POSTGRES_PASSWORD: rh
      POSTGRES_DB: referral_harvest
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  appdata:
  pgdata:
